# Template only — never commit real values (agents.md's "never bake ... credentials").
# Fill in and apply directly, or prefer:
#   kubectl create secret generic vault-publisher-repo --from-literal=VAULT_REPO_URL=<url>
#   kubectl create secret generic vault-publisher-ssh-key --from-file=id_ed25519=<key-path>
apiVersion: v1
kind: Secret
metadata:
  name: vault-publisher-repo
type: Opaque
stringData:
  VAULT_REPO_URL: "git@example.com:you/your-vault.git"
---
# NFR-SEC-1: mounted 0400 into git-sync only (see deployment.yaml) — SSH rejects
# the default Secret file mode (0644).
apiVersion: v1
kind: Secret
metadata:
  name: vault-publisher-ssh-key
type: Opaque
stringData:
  id_ed25519: |
    REPLACE WITH PRIVATE KEY CONTENTS
