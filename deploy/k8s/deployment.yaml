# EXAMPLE — see deploy/k8s/README.md. Copy and adapt; replace every REPLACE_* value
# before applying.
#
# Three-container Pod per BRD §8: git-sync (clone/pull), builder (this repo, quartz
# build + atomic promote), caddy (serve). hostPath ties the Pod to one node, hence
# nodeSelector below and strategy: Recreate — two Pods must never bind the same
# hostPath concurrently (FR-BUILD-2's two-step rename assumes a single writer).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-publisher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vault-publisher
  template:
    metadata:
      labels:
        app: vault-publisher
      annotations:
        # NFR-OBS-2 — daemon exposes Prometheus metrics on :9090/metrics (Phase 2,
        # see next-steps.md; scrape config is inert until the endpoint exists).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # hostPath binds this Pod to one node's local disk — REPLACE with the target node.
      nodeSelector:
        kubernetes.io/hostname: REPLACE_WITH_NODE_NAME
      # fsGroup does NOT apply to hostPath volumes (unlike PVCs), so it can't hand
      # ownership to a non-root UID on its own — hence the root initContainer below,
      # which chowns both volumes once at Pod start so git-sync/builder (uid 1000,
      # issue #8) can write them afterward.
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command: ["chown", "-R", "1000:1000", "/vault", "/site"]
          volumeMounts:
            - name: vault
              mountPath: /vault
            - name: site
              mountPath: /site
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.4
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          # RISK-9: if git-sync's rev-retention window is shorter than the slowest
          # build, a build can fail mid-read when its pinned rev gets GC'd. Retention
          # flag/behavior not verified against this pinned tag — check before relying on it.
          env:
            - name: GITSYNC_REPO
              valueFrom:
                secretKeyRef:
                  name: vault-publisher-repo
                  key: VAULT_REPO_URL
            - name: GITSYNC_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: vault-publisher-config
                  key: VAULT_BRANCH
            - name: GITSYNC_PERIOD
              valueFrom:
                configMapKeyRef:
                  name: vault-publisher-config
                  key: VAULT_SYNC_PERIOD
            - name: GITSYNC_ROOT
              value: /vault
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_SSH
              value: "true"
            - name: GITSYNC_SSH_KEY_FILE
              value: /ssh/id_ed25519
            # Required for SSH under a non-root, non-image-default UID (issue #8):
            # without it git fails with "No user exists for uid 1000" — confirmed
            # locally against registry.k8s.io/git-sync/git-sync:v4.2.4.
            - name: GITSYNC_ADD_USER
              value: "true"
          volumeMounts:
            - name: vault
              mountPath: /vault
            - name: ssh-key
              mountPath: /ssh
              readOnly: true
        - name: builder
          image: ghcr.io/OWNER/vault-publisher:latest # replace OWNER
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: vault-publisher-config
          volumeMounts:
            - name: vault
              mountPath: /vault
              readOnly: true
            - name: site
              mountPath: /site
        - name: caddy
          image: caddy:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /site
              readOnly: true
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          # readinessProbe, not livenessProbe: RISK-2's one-time pre-first-build 404
          # window must gate traffic, not restart a container that isn't actually broken.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        # REPLACE both hostPath.path values with real node-local directories.
        - name: vault
          hostPath:
            path: /mnt/vault-publisher/vault
            type: DirectoryOrCreate
        - name: site
          hostPath:
            path: /mnt/vault-publisher/site
            type: DirectoryOrCreate
        - name: ssh-key
          secret:
            secretName: vault-publisher-ssh-key
            defaultMode: 0400
            items:
              - key: id_ed25519
                path: id_ed25519
        - name: caddyfile
          configMap:
            name: vault-publisher-caddyfile
