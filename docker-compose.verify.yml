# Local stand-in for the three-container k8s Pod (BRD §8), used to verify the
# git-sync -> builder -> Caddy chain end-to-end before committing to k8s manifests.
# Not for production use: named volumes stand in for hostPath, and git-sync points at
# a throwaway local bare repo instead of a real remote.
#
# Usage:
#   ./deploy/verify/make-sample-vault.sh
#   docker compose -f docker-compose.verify.yml up --build
#   curl http://localhost:8080/
services:
  git-sync:
    image: registry.k8s.io/git-sync/git-sync:v4.2.4@sha256:8bfbf28623690fba06c65ec392e42023d28ecfc7e0fbfd4443388d020dc112ea
    user: root # named volume is root-owned; hostPath perms are a k8s-manifest concern, not this rig's
    volumes:
      - vault:/vault
      - ./deploy/verify/sample-vault.git:/repo:ro
    command:
      - --repo=file:///repo
      - --root=/vault
      - --link=current
      - --period=10s

  builder:
    build: .
    volumes:
      - vault:/vault:ro
      - site:/site
    environment:
      QUARTZ_BASE_URL: localhost:8080
      QUARTZ_PAGE_TITLE: Verify Vault
      POLL_INTERVAL: "5"
    depends_on:
      - git-sync

  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    volumes:
      - site:/site:ro
      - ./deploy/k8s/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"
    depends_on:
      - builder

volumes:
  vault:
  site:
