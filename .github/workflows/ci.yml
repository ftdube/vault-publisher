name: CI / CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vault-publisher

jobs:
  # Doc-only changes still need `build` to report — it's a required check —
  # so gate the work here instead of skipping the workflow with paths-ignore
  # (a skipped required check blocks the PR forever).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "**"
              - "!**/*.md"

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  scan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  build:
    needs: [changes, typecheck, test, scan]
    if: always()
    # Native arm64 runner: the only deploy target (RPi5) is arm64, and this
    # avoids QEMU-emulating the plugin pre-bake's native compilation (sharp,
    # tsup) — that emulation was most of what made this job so slow.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Gate on upstream jobs
        if: >-
          needs.changes.outputs.code == 'true' &&
          (needs.typecheck.result != 'success' ||
           needs.test.result != 'success' ||
           needs.scan.result != 'success')
        run: echo "::error::A prerequisite job failed" && exit 1

      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'

      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs.code == 'true'

      - uses: docker/login-action@v3
        if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: needs.changes.outputs.code == 'true'
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
