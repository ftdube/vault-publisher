name: CI / CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vault-publisher

jobs:
  # Every commit, docs included, so it never takes the `changes` gate.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every commit, so the scan below sees all of history
      # The CLI, not gitleaks-action: the action scans only the event's commit
      # range, and a secret anywhere in history is leaked, not just in this PR.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  # Doc-only changes still need `build` to report — it's a required check — so
  # gate the work here rather than skipping the workflow with paths-ignore.
  # A job skipped by `if:` reports `skipped`, which SATISFIES a required check.
  # A workflow that never runs reports nothing, and a required check that is
  # never reported blocks the pull request forever. That is the difference.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # 'some' (the default) ORs the rules, so "**" alone matches everything and
          # the negations below add matches instead of subtracting them. This is the
          # quantifier that makes an exclusion actually exclude.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!*.md"

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: bash scripts/ci-node-matches-dockerfile.sh

      - run: npm ci
      - run: npm run typecheck

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: bash scripts/ci-node-matches-dockerfile.sh

      - run: npm ci
      - run: npm test

  build:
    needs: [changes, typecheck, test]
    if: always()
    # Native arm64 runner: the only deploy target (RPi5) is arm64, and this
    # avoids QEMU-emulating the plugin pre-bake's native compilation (sharp,
    # tsup) — that emulation was most of what made this job so slow.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Gate on upstream jobs
        if: >-
          needs.changes.outputs.code == 'true' &&
          (needs.typecheck.result != 'success' ||
           needs.test.result != 'success')
        run: echo "::error::A prerequisite job failed" && exit 1

      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.code == 'true'

      - uses: docker/login-action@v4
        if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan the built image, not the repo: an fs scan flags devDependencies
      # that `npm prune --omit=dev` drops, and misses the base image's OS
      # packages, which do ship (issue #9). Load, scan, then push.
      - uses: docker/build-push-action@v7
        if: needs.changes.outputs.code == 'true'
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/trivy-action@v0.36.0
        if: needs.changes.outputs.code == 'true'
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          # Unfixed base-image CVEs would block every build with nothing to act on.
          ignore-unfixed: true

      # Every layer is cached from the step above, so this only pushes.
      - uses: docker/build-push-action@v7
        if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
