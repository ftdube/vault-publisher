name: CI / CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vault-publisher

jobs:
  # One job, not four: every job bills its own rounded-up minute and its own
  # checkout, and typecheck/test already ran before the image build anyway.
  build:
    # Native arm64 runner: the only deploy target (RPi5) is arm64, and this
    # avoids QEMU-emulating the plugin pre-bake's native compilation (sharp,
    # tsup) — that emulation was most of what made this job so slow. Tests
    # run here too, so they run on the architecture that ships.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      # paths-filter lists a pull request's files through the API.
      pull-requests: read

    steps:
      - uses: actions/checkout@v7

      # Doc-only changes still need `build` to report — it's a required check —
      # so gate the steps here rather than skipping the workflow with
      # paths-ignore. A workflow that never runs reports nothing, and a
      # required check that is never reported blocks the pull request forever.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # 'some' (the default) ORs the rules, so "**" alone matches everything and
          # the negations below add matches instead of subtracting them. This is the
          # quantifier that makes an exclusion actually exclude.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!*.md"

      - uses: actions/setup-node@v7
        if: steps.filter.outputs.code == 'true'
        with:
          node-version: 26
          cache: npm

      - run: bash scripts/ci-node-matches-dockerfile.sh
        if: steps.filter.outputs.code == 'true'

      - run: npm ci
        id: install
        if: steps.filter.outputs.code == 'true'

      - run: npm run typecheck
        if: steps.filter.outputs.code == 'true'

      # Runs even when typecheck fails, so one push shows both kinds of failure.
      - run: npm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

      - uses: docker/setup-buildx-action@v4
        if: steps.filter.outputs.code == 'true'

      - uses: docker/login-action@v4
        if: steps.filter.outputs.code == 'true' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan the built image, not the repo: an fs scan flags devDependencies
      # that `npm prune --omit=dev` drops, and misses the base image's OS
      # packages, which do ship (issue #9). Load, scan, then push.
      - uses: docker/build-push-action@v7
        if: steps.filter.outputs.code == 'true'
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/trivy-action@v0.36.0
        if: steps.filter.outputs.code == 'true'
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          # Unfixed base-image CVEs would block every build with nothing to act on.
          ignore-unfixed: true

      # Every layer is cached from the step above, so this only pushes.
      - uses: docker/build-push-action@v7
        if: steps.filter.outputs.code == 'true' && github.event_name == 'push'
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
